[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utsu-core"
version = "0.1.0"
description = "UTSU web application backend for Senate, student aid, and AGM workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "pydantic>=2", "uvicorn", "pyyaml", "cryptography>=50", "segno>=1.6.6", "redis>=5", "google-re2>=1.1", "pyjwt>=2.10.1"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "fakeredis", "sqlalchemy>=2", "email-validator>=2", "eth-account>=0.13"]
portal = []  # retained for existing deployment configurations
container-dev = [
    "httpx",
    "opentelemetry-distro==0.59b0",
    "opentelemetry-instrumentation-fastapi==0.59b0",
    "opentelemetry-exporter-otlp-proto-http==1.38.0",
]
firestore = ["google-cloud-firestore"]
sql = ["sqlalchemy>=2"]  # + a driver: psycopg (PostgreSQL/Supabase), pyodbc (Azure SQL), pymysql
mailsvc = ["sqlalchemy>=2", "email-validator>=2"]
evm = ["eth-account>=0.13"]  # PORTAL_ANCHOR=evm: sign anchor transactions locally
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-jaeger>=1.20",
    "opentelemetry-exporter-prometheus>=0.41b0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-flask>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-asyncio>=0.41b0",
    "opentelemetry-propagators-jaeger>=1.20"
]
filesvc = [
    "boto3>=1.26",  # AWS S3
    "google-cloud-storage>=2.10",  # Google Cloud Storage
    "azure-storage-blob>=12.17",  # Azure Blob Storage
]
authsvc = [
    "bcrypt>=4.1",  # Password hashing
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["utsu_core", "utsu_core.*"]

[tool.setuptools.package-data]
utsu_core = ["schema/*.sql", "static/*", "static/assets/*", "branding/*", "plugin_manifests/*.json", "mail/templates/historical/*.txt", "mail/templates/historical/*.html", "mail/templates/live/*.txt"]
"utsu_core.programs.senate" = ["*.sql", "forms/*.yaml"]
"utsu_core.programs.sap" = ["*.sql", "forms/*.yaml"]
"utsu_core.programs.agm" = ["*.sql", "forms/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
