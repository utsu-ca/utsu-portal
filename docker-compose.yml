# Local single-application deployment. For split authentication use deploy/k8s.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: "${PORTAL_DB_PASSWORD:?Set PORTAL_DB_PASSWORD}"
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "portal", "-d", "portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  portal:
    build:
      context: .
      dockerfile: Dockerfile
    environment: &portal-environment
      PORTAL_APP: utsu_core:create_app
      PORTAL_SECRET: "${PORTAL_SECRET:?Set a stable PORTAL_SECRET of at least 32 characters}"
      PORTAL_STORE: sql
      DATABASE_URL: "postgresql+psycopg://portal:${PORTAL_DB_PASSWORD:?Set PORTAL_DB_PASSWORD}@postgres:5432/portal"
      PORTAL_REDIS_URL: redis://redis:6379
      PORTAL_BASE_URL: "${PORTAL_BASE_URL:-http://127.0.0.1:8000}"
      PORTAL_ADMIN_EMAILS: "${PORTAL_ADMIN_EMAILS:-}"
      PORTAL_APPLICANT_EMAIL_DOMAINS: "${PORTAL_APPLICANT_EMAIL_DOMAINS:-}"
      PORTAL_TURNSTILE_SITE_KEY: "${PORTAL_TURNSTILE_SITE_KEY:-}"
      PORTAL_TURNSTILE_SECRET_KEY: "${PORTAL_TURNSTILE_SECRET_KEY:-}"
      PORTAL_COMMIT: "${PORTAL_COMMIT:-}"  # e.g. PORTAL_COMMIT=$(git rev-parse HEAD) docker compose up
      PORTAL_SMTP_URL: "${PORTAL_SMTP_URL:-}"
      PORTAL_MAIL_FROM: "${PORTAL_MAIL_FROM:-no-reply@localhost}"
      PORTAL_HSTS: "0"
      PORTAL_USER_STORAGE_BYTES: "${PORTAL_USER_STORAGE_BYTES:-15000000}"
      PORTAL_CLUB_STORAGE_YEAR_BYTES: "${PORTAL_CLUB_STORAGE_YEAR_BYTES:-1073741824}"
      PORTAL_RECEIPT_STORAGE_PATH: /app/receipt-files
      PORTAL_RECEIPT_COLD_REMOTE: "${PORTAL_RECEIPT_COLD_REMOTE:-}"
      PORTAL_RECEIPT_ARCHIVE_ENABLED: "${PORTAL_RECEIPT_ARCHIVE_ENABLED:-0}"
      RCLONE_CONFIG: /run/secrets/storage/rclone.conf
    volumes:
      - portal-receipt-files:/app/receipt-files
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  receipt-maintenance:
    profiles: ["storage"]
    build:
      context: .
      dockerfile: Dockerfile
    environment: *portal-environment
    command: ["sh", "-ec", "while :; do python -m utsu_core.receipt_maintenance --migrate --scheduled; sleep 86400; done"]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - portal-receipt-files:/app/receipt-files
      - type: bind
        source: ./secrets/storage
        target: /run/secrets/storage
        read_only: true
        bind:
          create_host_path: false

volumes:
  portal-db-data:
  portal-receipt-files:
